version: "2"
sql:
  - engine: postgresql
    schema: internal/db/schema/migrations
    queries: internal/db/query
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        rename:
          vm_platform: VMPlatform
          vm_platform_id: VMPlatformID
          required_vm_platform_id: RequiredVMPlatformID
          api_key: APIKey
          available_cpu_millis: AvailableCPUMillis
          available_vm_slots: AvailableVMSlots
          capacity_cpu_millis: CapacityCPUMillis
          cpu_config_digest: CPUConfigDigest
          cpu_environment: CPUEnvironment
          cpu_environment_digest: CPUEnvironmentDigest
          cpu_shape_config_digests: CPUShapeConfigDigests
          cpu_shape_vcpu_counts: CPUShapeVCPUCounts
          cpu_template_digest: CPUTemplateDigest
          cpu_template_kind: CPUTemplateKind
          epoch_cpu_millis: EpochCPUMillis
          max_vm_slots: MaxVMSlots
          max_vm_starts: MaxVMStarts
          vm_paused_reason: VMPausedReason
          per_vm_cpu_millis: PerVMCPUMillis
          per_vm_guest_ephemeral_disk_bytes: PerVMGuestEphemeralDiskBytes
          per_vm_memory_bytes: PerVMMemoryBytes
          profile_image_url: ProfileImageURL
          requested_cpu_millis: RequestedCPUMillis
          required_cpu_config_digest: RequiredCPUConfigDigest
          required_cpu_millis: RequiredCPUMillis
          required_vm_vcpu_count: RequiredVMVCPUCount
          reserved_cpu_millis: ReservedCPUMillis
          vm_vcpu_count: VMVCPUCount
          vcpu_count: VCPUCount
          worker_pool_ids: WorkerPoolIDs
          vm_state: VMState

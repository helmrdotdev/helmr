syntax = "proto3";

package helmr.computer.v0;

option go_package = "github.com/helmrdotdev/helmr/internal/proto/computer/v0;computerv0";

// The owned VM transport selects the single Computer filesystem. Acknowledgement
// covers its retained descriptor; it does not attest remote publication.
message FlushComputerRequest {
  string operation_id = 1;
}

message FlushComputerResponse {
  string operation_id = 1;
  string error = 2;
}

message ComputerOperationEnvelope {
  string operation_id = 1;
  string computer_instance_id = 2;
  string computer_id = 3;
  string channel_credential = 4;
  uint64 writer_generation = 5;
  string instance_lease_id = 6;
  string write_lease_id = 7;
  string fencing_token = 8;
  int64 operation_expires_at_unix_nano = 9;
  string request_fingerprint = 10;
}


message MaterializeComputerRequest {
  reserved 4, 5, 7;
  ComputerOperationEnvelope envelope = 1;
  string mount_path = 2;
  ComputerMountTarget target = 3;
}

message ComputerMountPhase {
  string name = 1;
  uint64 duration_ms = 2;
  uint64 size_bytes = 3;
  uint32 entry_count = 4;
  string error = 5;
}

message MaterializeComputerResponse {
  string status = 1;
  string guest_channel_credential_hash = 2;
  repeated ComputerMountPhase phases = 3;
  ComputerMountTarget target = 4;
}

// OCI runtime settings verified by the worker for the mounted Computer.
message RuntimeImageConfig {
  repeated string env = 1;
  string working_dir = 2;
  string user = 3;
  repeated string entrypoint = 4;
  repeated string cmd = 5;
}

message PrepareComputerRuntimeRequest {
  reserved 3;
  string computer_id = 5;
  int64 writer_generation = 6;
  string computer_instance_id = 1;
  string mount_path = 2;
  // The substrate is already mounted; the request supplies its admitted settings.
  RuntimeImageConfig mounted_image_config = 4;
}

message PrepareComputerRuntimeResponse {
  string status = 1;
  string computer_instance_id = 2;
  repeated ComputerMountPhase phases = 3;
}

// The host has already materialized the retained Computer disk version.
message ComputerMountTarget {
  string base_computer_disk_version_id = 1;
}

message ComputerCommandAuthority {
  string operation_id = 1;
  string computer_instance_id = 2;
  string computer_id = 3;
  string channel_credential = 4;
  int64 writer_generation = 5;
  int64 operation_expires_at_unix_nano = 6;
  string request_fingerprint = 7;
}

message ComputerBasicExecRequest {
  ComputerCommandAuthority envelope = 1;
  string request_json = 2;
  repeated ComputerSecretDelivery secrets = 3;
  bytes stdin = 4;
  map<string,string> protected_env = 5;
  bytes proxy_ca = 6;
  CommandLogLimits log_limits = 7;
  bool tail_only = 8;
}

message ComputerBasicExecResult {
  string error_json = 1;
  int32 exit_code = 2;
  string outcome = 5;
  string request_fingerprint = 6;
  CommandOutputBoundary stdout = 7;
  CommandOutputBoundary stderr = 8;
}

message CommandOutputChunk {
  string stream = 1;
  uint64 sequence = 2;
  int64 observed_at_unix_nano = 3;
  bytes content = 4;
  string kind = 5;
  uint64 through_sequence = 6;
  int64 dropped_bytes = 7;
  bool complete = 8;
}

message CommandLogLimits {
  int32 chunk_bytes = 1;
  int64 buffer_bytes = 2;
  int32 buffer_records = 3;
}

message CommandOutputBoundary {
  uint64 through_sequence = 1;
  bool complete = 2;
  bool gapped = 3;
}

// Only a committed durable receipt or explicit expiry can release a head.
message CommandOutputAck {
  string stream = 1;
  uint64 through_sequence = 2;
  string disposition = 3;
}

message ComputerBasicExecEvent {
  oneof event {
    CommandOutputChunk output = 1;
    ComputerBasicExecResult result = 2;
  }
}

message ComputerSecretDelivery {
  string placement_kind = 1;
  string placement_target = 2;
  bytes value = 3;
}

message ComputerCommandReleaseRequest {
 ComputerCommandAuthority authority = 1;
 bool output_fenced = 2;
}
message ComputerCommandReleaseResponse {
 bool released = 1;
 string error = 2;
}

message ComputerCommandCancelRequest {
 ComputerCommandAuthority authority = 1;
}
message ComputerCommandCancelResponse {
 bool accepted = 1;
 string error = 2;
}

// One private preparation owns the mounted image until capture and physical stop.
// Empty start probes or renews an existing executor; it never starts authored code.
message PreparationIdentity {
  string preparation_id = 1;
  string instance_id = 2;
  int64 epoch = 3;
  bytes channel_credential = 4;
}
message PreparationStart {
  string computer_definition_id = 1;
  repeated ComputerSecretDelivery secrets = 2;
  PreparationLogLimits log_limits = 3;
  map<string, string> protected_env = 4;
  bytes proxy_ca = 5;
}
message PreparationLogLimits {
  int32 chunk_bytes = 1;
  int64 buffer_bytes = 2;
  int32 buffer_records = 3;
}
message PreparationLog {
  string kind = 1;
  int64 sequence = 2;
  int64 through_sequence = 3;
  int64 observed_at_unix_nano = 4;
  bytes data = 5;
  int64 dropped_bytes = 6;
  bool complete = 7;
}
message PreparationControlRequest {
  PreparationIdentity identity = 1;
  int64 expires_at_unix_nano = 2;
  PreparationStart start = 3;
  bool renew_only = 4;
  string log_stream = 5;
  int64 acknowledged_through = 6;
}
message PreparationControlResponse {
  string state = 1;
  string error_code = 2;
  PreparationLog log = 3;
}

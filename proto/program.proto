syntax = "proto3";

package helmr.program.v0;

option go_package = "github.com/helmrdotdev/helmr/internal/proto/program/v0;programv0";

message ProgramStart {
  string entrypoint_declared_id = 1;
  string run_id = 2;
  uint32 attempt_number = 3;
  RunCause cause = 4;
  string deployment_id = 5;
  string deployment_version = 6;
  string workspace_id = 7;
  string base_workspace_version_id = 8;

  oneof entrypoint {
    TaskStart task = 9;
    ActorStart actor = 10;
  }
}

message TaskStart {
  oneof payload {
    NoPayload no_payload = 1;
    bytes payload_json = 2;
  }
}

message NoPayload {}

message ActorStart {
  string session_id = 1;
  optional string key = 2;
  int64 start_input_sequence = 3;
  int64 input_high_watermark = 4;
  int64 run_generation = 5;
}

message RunCause {
  oneof kind {
    ApiCause api = 1;
    ManualCause manual = 2;
    ChildCause child = 3;
    ScheduleCause schedule = 4;
    ActorStartCause actor_start = 5;
    ContinuationCause continuation = 6;
  }
}

message ApiCause {}

message ManualCause {}

message ChildCause {
  string parent_run_id = 1;
}

message ScheduleCause {
  string schedule_id = 1;
  int64 scheduled_at_unix_ms = 2;
  optional int64 previous_scheduled_at_unix_ms = 3;
  string timezone = 4;
}

message ActorStartCause {}

message ContinuationCause {}

message ProgramRunRequest {
  string run_id = 1;
  uint32 attempt_number = 2;
  string run_lease_id = 3;
  bytes program_start_frame = 4;
  uint32 secret_count = 5;
  int64 start_deadline_unix_ms = 6;
  map<string,string> protected_env = 7;
  bytes proxy_ca = 8;
}

message ProgramSecret {
  oneof placement {
    string env = 1;
    string file = 2;
  }
  bytes value = 3;
}

message ProgramSecretsComplete {
  string run_id = 1;
  uint32 attempt_number = 2;
  string run_lease_id = 3;
  uint32 secret_count = 4;
}

message ProgramSupervisorCommand {
  oneof command {
    ProgramSecret secret_delivery = 1;
    ProgramSecretsComplete secrets_complete = 2;
    ProgramStartRelease start_release = 3;
    EntrypointRelease entrypoint_release = 4;
  }
}

message ProgramProcessStarted {
  string run_id = 1;
  uint32 attempt_number = 2;
  string run_lease_id = 3;
}

message ProgramProcessStartFailed {
  string run_id = 1;
  uint32 attempt_number = 2;
  string run_lease_id = 3;
  string phase = 4;
  string diagnostic = 5;
}

message ProgramStartRelease {
  string run_id = 1;
  uint32 attempt_number = 2;
  string run_lease_id = 3;
}

message EntrypointIdentity {
  string declared_id = 1;
  oneof kind {
    TaskEntrypoint task = 2;
    ActorEntrypoint actor = 3;
  }
}

message TaskEntrypoint {}

message ActorEntrypoint {}

message EntrypointReady {
  string run_id = 1;
  uint32 attempt_number = 2;
  EntrypointIdentity entrypoint = 3;
}

message EntrypointRelease {
  string run_id = 1;
  uint32 attempt_number = 2;
  EntrypointIdentity entrypoint = 3;
}

message RunEvent {
  reserved 3, 9, 10, 27, 28, 29;

  oneof event {
    bytes stdout_chunk = 1;
    bytes stderr_chunk = 2;
    RunWaitRequested run_wait_requested = 5;
    MetadataUpdated metadata_updated = 7;
    TokenCreateRequested token_create_requested = 8;
    ResumeConsumed resume_consumed = 6;
    ProgramProcessStarted program_process_started = 11;
    EntrypointReady entrypoint_ready = 12;
    TaskOutcome task_outcome = 13;
    ProgramQuiesced program_quiesced = 14;
    ActorOutcome actor_outcome = 15;
    TurnSettleRequested turn_settle_requested = 16;
    TurnOutputWriteRequested turn_output_write_requested = 17;
    SessionSubmitRequested session_submit_requested = 18;
    StructuredLogRequested structured_log_requested = 19;
    TaskChildInvokeRequested task_child_invoke_requested = 20;
    ActorStartRequested actor_start_requested = 21;
    SessionStatusRequested session_status_requested = 22;
    SessionCloseRequested session_close_requested = 23;
    SessionEventsRequested session_events_requested = 24;
    WorkspaceCreateRequested workspace_create_requested = 25;
    WorkspaceRetrieveRequested workspace_retrieve_requested = 26;
    WorkspaceExecRequested workspace_exec_requested = 30;
    WorkspaceDeleteRequested workspace_delete_requested = 31;
    ProgramProcessStartFailed program_process_start_failed = 32;
    SessionOutputWriteRequested session_output_write_requested = 33;
    TurnReadyRequested turn_ready_requested = 34;
    TurnMessageClaimRequested turn_message_claim_requested = 35;
    TurnMessageCompleteRequested turn_message_complete_requested = 36;
    TurnSettlementBeginRequested turn_settlement_begin_requested = 37;
    SessionTurnRetrieveRequested session_turn_retrieve_requested = 38;
    SessionTurnInterruptRequested session_turn_interrupt_requested = 39;
    SessionResumeRequested session_resume_requested = 40;
  }
}

message TaskOutcome {
  oneof outcome {
    TaskSucceeded succeeded = 1;
    TaskFailed failed = 2;
    TaskPayloadInvalid payload_invalid = 3;
  }
}

message TaskSucceeded {
  string output_json = 1;
}

message TaskFailed {
  string message = 1;
  optional string details_json = 2;
}

message TaskPayloadInvalid {
  string message = 1;
  optional string details_json = 2;
}

message ActorOutcome {
  int64 run_generation = 1;
  oneof outcome {
    ActorSucceeded succeeded = 2;
    ActorFailed failed = 3;
    ActorInterrupted interrupted = 4;
  }
}

message ActorSucceeded {}

message ActorFailed {
  string message = 1;
  optional string details_json = 2;
}

message SessionExecution {
  string session_id = 1;
  string run_id = 2;
  uint32 attempt_number = 3;
  int64 run_generation = 4;
}

message TurnExecution {
  SessionExecution session = 1;
  string turn_id = 2;
}

message ActorInterrupted {
  string hold_id = 1;
  optional string turn_id = 2;
}

message SessionStop {
  SessionExecution execution = 1;
  optional string turn_id = 2;
  string hold_id = 3;
  string reason = 4;
}

message TurnSettlementBeginRequested {
  string correlation_id = 1;
  TurnExecution execution = 2;
}

message TurnSettleRequested {
  string correlation_id = 1;
  int64 target_input_sequence = 2;
  TurnExecution execution = 3;
  string disposition = 4;
  optional string result_json = 5;
  optional string error_json = 6;
}

message TurnSettlePauseRequest {
  string correlation_id = 1;
  int64 target_input_sequence = 2;
  string run_id = 3;
  uint32 attempt_number = 4;
  string run_lease_id = 5;
  string expected_tree_digest = 6;
  int64 expected_tree_size_bytes = 7;
  uint32 expected_tree_entry_count = 8;
  string expected_base_workspace_version_id = 9;
  TurnExecution execution = 10;
}

message TurnSettlePauseReady {
  string correlation_id = 1;
  int64 target_input_sequence = 2;
  string run_id = 3;
  uint32 attempt_number = 4;
  string run_lease_id = 5;
  string tree_digest = 6;
  int64 tree_size_bytes = 7;
  uint32 tree_entry_count = 8;
  bool workspace_changed = 9;
  TurnExecution execution = 10;
}

message TurnSettleApplied {
  string correlation_id = 1;
  int64 target_input_sequence = 2;
  string run_id = 3;
  uint32 attempt_number = 4;
  string run_lease_id = 5;
  string previous_base_workspace_version_id = 6;
  string applied_base_workspace_version_id = 7;
  TurnExecution execution = 8;
}

message TurnReadyRequested {
  string correlation_id = 1;
  TurnExecution execution = 2;
}

message TurnMessageClaimRequested {
  string correlation_id = 1;
  TurnExecution execution = 2;
  string delivery_id = 3;
}

message TurnMessageCompleteRequested {
  string correlation_id = 1;
  TurnExecution execution = 2;
  string message_id = 3;
  string delivery_id = 4;
  string status = 5;
  string code = 6;
  optional string details_json = 7;
}

message TurnOutputWriteRequested {
  string correlation_id = 1;
  TurnExecution execution = 2;
  string data_json = 3;
  optional string idempotency_key = 4;
  optional string message_delivery_id = 5;
}

message SessionOutputWriteRequested {
  string correlation_id = 1;
  SessionExecution execution = 2;
  string data_json = 3;
  optional string idempotency_key = 4;
}

message SessionSubmitRequested {
  string correlation_id = 1;
  string session_id = 2;
  string mode = 3;
  optional string turn_id = 4;
  string data_json = 5;
  optional string idempotency_key = 6;
}

message SessionTurnRetrieveRequested {
  string correlation_id = 1;
  string session_id = 2;
  string turn_id = 3;
}

message SessionTurnInterruptRequested {
  string correlation_id = 1;
  string session_id = 2;
  string turn_id = 3;
  optional string idempotency_key = 4;
}

message SessionResumeRequested {
  string correlation_id = 1;
  string session_id = 2;
  string hold_id = 3;
  optional string idempotency_key = 4;
}

message ActorStartRequested {
  string correlation_id = 1;
  string declared_id = 2;
  string workspace_id = 3;
  optional string key = 5;
  optional string idempotency_key = 7;
  string run_options_json = 8;
}

message SessionStatusRequested {
  string correlation_id = 1;
  string session_id = 2;
}

message SessionCloseRequested {
  string correlation_id = 1;
  string session_id = 2;
  optional string idempotency_key = 3;
}

message SessionEventsRequested {
  string correlation_id = 1;
  string session_id = 2;
  optional int64 after = 3;
  uint32 limit = 4;
}

message WorkspaceAddress {
  string workspace_id = 1;
}

message SecretEnvBinding {
  string name = 1;
  string mode = 2;
  repeated string allowed_origins = 3;
}
message SecretFileBinding { string path = 1; }
message WorkspaceSecretPlacement {
  string secret = 1;
  oneof placement {
    SecretEnvBinding env = 2;
    SecretFileBinding file = 3;
  }
}

message WorkspaceCreateRequested {
  string correlation_id = 1;
  string declared_id = 2;
  optional string key = 3;
  repeated WorkspaceSecretPlacement secrets = 4;
  optional string idempotency_key = 5;
}

message WorkspaceRetrieveRequested {
  string correlation_id = 1;
  WorkspaceAddress workspace = 2;
}

message WorkspaceExecRequested {
  string correlation_id = 1;
  WorkspaceAddress workspace = 2;
  repeated string command = 3;
  optional string cwd = 4;
  map<string, string> env = 5;
  bytes stdin = 6;
  optional uint64 timeout_ms = 7;
  string idempotency_key = 8;
}

message WorkspaceDeleteRequested {
  string correlation_id = 1;
  WorkspaceAddress workspace = 2;
  optional string idempotency_key = 3;
}

message ProgramQuiesced {
  string run_id = 1;
  uint32 attempt_number = 2;
  string run_lease_id = 3;
}

message RunWaitRequested {
  string correlation_id = 1;
  string kind = 2;
  string params_json = 3;
  optional string metadata_json = 4;
  optional uint64 timeout_ms = 5;
  repeated string tags = 6;
  string run_wait_id = 7;
  string resume_attach_id = 8;
  optional uint64 idle_timeout_ms = 9;
  optional int64 actor_speculative_input_sequence = 10;
  SessionExecution execution = 11;
  optional string turn_id = 12;
}

message TokenCreateRequested {
  optional uint64 timeout_ms = 1;
  string correlation_id = 2;
  optional string idempotency_key = 3;
  repeated string tags = 4;
  optional string metadata_json = 5;
}

message TaskChildInvokeRequested {
  string correlation_id = 1;
  string declared_id = 2;
  string method = 3;
  bool payload_present = 4;
  optional string payload_json = 5;
  string workspace_json = 6;
  string options_json = 7;
  optional string idempotency_key = 8;
  optional int64 actor_speculative_input_sequence = 9;
  string run_wait_id = 10;
  string resume_attach_id = 11;
  SessionExecution execution = 12;
  optional string turn_id = 13;
}

message CheckpointPauseRequest {
  string run_wait_id = 1;
  string checkpoint_id = 2;
  bool capture_workspace = 3;
  string run_id = 4;
  uint32 attempt_number = 5;
  string run_lease_id = 6;
  string resume_attach_id = 7;
  int64 checkpoint_request_version = 8;
  string correlation_id = 9;
  SessionExecution execution = 10;
  optional string turn_id = 11;
}

message ResumeAttach {
  string checkpoint_id = 1;
  string run_wait_id = 2;
  string run_lease_id = 3;
  string run_id = 4;
  uint32 attempt_number = 5;
  string resume_attach_id = 6;
  int64 resume_request_version = 7;
  string correlation_id = 8;
  SessionExecution execution = 9;
  optional string turn_id = 10;
}

message ResumeDecision {
  string run_wait_id = 1;
  string kind = 2;
  string data_json = 3;
  bool require_consumed_ack = 4;
  string checkpoint_id = 5;
  string resume_attach_id = 6;
  int64 resume_request_version = 7;
  string run_lease_id = 8;
  string correlation_id = 9;
  bool no_result = 10;
}

message ResumeAck {
  string run_wait_id = 1;
  string checkpoint_id = 2;
  string resume_attach_id = 3;
  int64 resume_request_version = 4;
  string run_lease_id = 5;
  string correlation_id = 6;
}

message ResumeConsumed {
  string run_wait_id = 1;
  string checkpoint_id = 2;
  string resume_attach_id = 3;
  int64 resume_request_version = 4;
  string run_lease_id = 5;
  string correlation_id = 6;
}

message MetadataUpdated {
  string operation = 1;
  optional string key = 2;
  optional string value_json = 3;
  optional string patch_json = 4;
  optional double amount = 5;
  string correlation_id = 6;
}

message StructuredLogRequested {
  string correlation_id = 1;
  string level = 2;
  string message = 3;
  string attributes_json = 4;
}

name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [policy, go, typescript]
    env:
      CI_CHECK: ${{ matrix.check }}
      GOCACHE: /tmp/helmr-ci-go-build
      GOMODCACHE: /tmp/helmr-ci-go-mod
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Cache Go compilation and modules
        if: matrix.check == 'go'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'go.mod', 'go.sum') }}-
      - run: nix run ".#ci-fast-$CI_CHECK"
  ci-complete:
    name: ci complete
    if: always()
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - name: Require all source checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success

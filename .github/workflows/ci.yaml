name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix-flake:
    name: nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      # PR caches are scoped to their merge ref; release never restores them.
      - name: Cache Nix check dependencies
        uses: nix-community/cache-nix-action@099b5eda36d156fcdd6477de3db9e7fa4caf800f
        with:
          primary-key: nix-flake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**', 'go.mod', 'go.sum') }}-${{ github.sha }}
          restore-prefixes-first-match: nix-flake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**', 'go.mod', 'go.sum') }}-
          # GC target, not a hard archive-size limit. Measure save/restore overhead.
          gc-max-store-size: 2G

      - run: nix flake check --show-trace

  repo:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    env:
      GOCACHE: /tmp/helmr-ci-go-build
      GOMODCACHE: /tmp/helmr-ci-go-mod
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: repo policy
            app: ci-policy
          - name: generated
            app: ci-generated
          - name: typescript
            app: ci-typescript
          - name: go lint
            app: ci-go-lint
          - name: go build
            app: ci-go-build
          - name: go race
            app: ci-go-race
          - name: linux compile
            app: ci-linux-compile
          - name: Firecracker probe
            app: ci-firecracker-probe
          - name: linux lint
            app: ci-linux-lint
          - name: infrastructure
            app: ci-infra-test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Cache Go compilation and modules
        if: matrix.app == 'ci-go-race'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: go-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'go.mod', 'go.sum') }}-

      - name: Prepare check environment
        run: >-
          nix build --no-link --impure --expr
          'let flake = builtins.getFlake (toString ./.);
          in builtins.dirOf (builtins.dirOf flake.apps.x86_64-linux.${{ matrix.app }}.program)'

      - run: nix run .#${{ matrix.app }}

  postgres:
    name: postgres
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Prepare check environment
        run: >-
          nix build --no-link --impure --expr
          'let flake = builtins.getFlake (toString ./.);
          in builtins.dirOf (builtins.dirOf flake.apps.x86_64-linux.ci-postgres.program)'

      - run: nix run .#ci-postgres

  browser:
    name: browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Prepare check environment
        run: >-
          nix build --no-link --impure --expr
          'let flake = builtins.getFlake (toString ./.);
          in builtins.dirOf (builtins.dirOf flake.apps.x86_64-linux.ci-browser.program)'

      - run: nix run .#ci-browser

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  bundle-builder:
    name: bundle builder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Prepare check environment
        run: >-
          nix build --no-link --impure --expr
          'let flake = builtins.getFlake (toString ./.);
          in builtins.dirOf (builtins.dirOf flake.apps.x86_64-linux.ci-bundle-builder.program)'

      - run: nix run .#ci-bundle-builder

  release-contracts:
    name: release contracts (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [ci-version-cohort, ci-boot-artifacts-repro]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Prepare check environment
        run: >-
          nix build --no-link --impure --expr
          'let flake = builtins.getFlake (toString ./.);
          in builtins.dirOf (builtins.dirOf flake.apps.x86_64-linux.${{ matrix.app }}.program)'

      - run: nix run .#${{ matrix.app }}

  ci-complete:
    name: ci complete
    runs-on: ubuntu-24.04
    needs:
      - nix-flake
      - repo
      - postgres
      - browser
      - bundle-builder
      - release-contracts
    if: always()
    steps:
      - name: Check required CI jobs
        run: |
          failed=0
          for result in \
            "${{ needs.nix-flake.result }}" \
            "${{ needs.repo.result }}" \
            "${{ needs.postgres.result }}" \
            "${{ needs.browser.result }}" \
            "${{ needs.bundle-builder.result }}" \
            "${{ needs.release-contracts.result }}"
          do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            printf 'CI dependency results: nix-flake=%s repo=%s postgres=%s browser=%s bundle-builder=%s release-contracts=%s\n' \
              "${{ needs.nix-flake.result }}" \
              "${{ needs.repo.result }}" \
              "${{ needs.postgres.result }}" \
              "${{ needs.browser.result }}" \
              "${{ needs.bundle-builder.result }}" \
              "${{ needs.release-contracts.result }}" >&2
            exit 1
          fi

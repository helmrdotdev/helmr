name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [policy, go, typescript]
    env:
      CI_CHECK: ${{ matrix.check }}
      GOCACHE: /tmp/helmr-ci-go-build
      GOMODCACHE: /tmp/helmr-ci-go-mod
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Cache Nix tools
        if: matrix.check == 'go'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          # Reuse tool realizations across source changes; Nix still resolves every input.
          primary-key: nix-ci-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**', 'bun.lock', 'bunfig.toml', '**/package.json', 'internal/version/runtime-dependencies.json', '.github/actions/setup-nix/action.yaml') }}
      - name: Cache Go compilation and modules
        if: matrix.check == 'go'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'go.mod', 'go.sum') }}-
      - name: Allow the native sandbox helper to create user namespaces
        if: matrix.check == 'typescript'
        run: |
          # Ubuntu 24.04 requires an application profile for unprivileged userns.
          # Permit the Nix-pinned helper while retaining the runner's global policy.
          sudo tee /etc/apparmor.d/helmr-ci-bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          profile helmr-ci-bwrap /nix/store/*-bubblewrap-*/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/helmr-ci-bwrap
      - run: nix run ".#ci-fast-$CI_CHECK"
  security:
    name: Source dependency and configuration scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - id: db
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cache/trivy/db
            ~/.cache/trivy/policy
          key: source-vulndb-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ steps.db.outputs.day }}
          restore-keys: source-vulndb-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
      - run: nix run .#security-scan -- --source . --report "$RUNNER_TEMP/findings.json"
      - run: python3 scripts/release/security_decision.py "$RUNNER_TEMP/findings.json" .github/security-assessments.json "$RUNNER_TEMP/decision.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-security
          path: |
            ${{ runner.temp }}/findings.json
            ${{ runner.temp }}/decision.json
          overwrite: true
          if-no-files-found: error
  ci-complete:
    name: ci complete
    if: always()
    needs: [checks, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all source checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "$CHECKS_RESULT" = success && test "$SECURITY_RESULT" = success

name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-flake:
    name: nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - run: nix flake check --show-trace

  repo:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: repo policy
            app: ci-policy
          - name: generated
            app: ci-generated
          - name: typescript
            app: ci-typescript
          - name: go lint
            app: ci-go-lint
          - name: go build
            app: ci-go-build
          - name: go race
            app: ci-go-race
          - name: linux compile
            app: ci-linux-compile
          - name: Firecracker probe
            app: ci-firecracker-probe
          - name: linux lint
            app: ci-linux-lint
          - name: infrastructure
            app: ci-infra-test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - run: nix run .#${{ matrix.app }}

  postgres:
    name: postgres
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - run: nix run .#ci-postgres

  bundle-builder:
    name: bundle builder
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - run: nix develop .#images --command bash tests/bundle_builder_e2e.sh

  release-contracts:
    name: release contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - run: nix develop --command tests/version_cohort_test.sh
      - run: nix run .#ci-boot-artifacts-repro

  ci-complete:
    name: ci complete
    runs-on: ubuntu-24.04
    needs:
      - nix-flake
      - repo
      - postgres
      - bundle-builder
      - release-contracts
    if: always()
    steps:
      - name: Check required CI jobs
        run: |
          failed=0
          for result in \
            "${{ needs.nix-flake.result }}" \
            "${{ needs.repo.result }}" \
            "${{ needs.postgres.result }}" \
            "${{ needs.bundle-builder.result }}" \
            "${{ needs.release-contracts.result }}"
          do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            printf 'CI dependency results: nix-flake=%s repo=%s postgres=%s bundle-builder=%s release-contracts=%s\n' \
              "${{ needs.nix-flake.result }}" \
              "${{ needs.repo.result }}" \
              "${{ needs.postgres.result }}" \
              "${{ needs.bundle-builder.result }}" \
              "${{ needs.release-contracts.result }}" >&2
            exit 1
          fi

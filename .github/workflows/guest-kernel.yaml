name: Rescan stable guest kernel
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  attestations: read
concurrency:
  group: stable-guest-kernel
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Fetch the current stable release
        run: |
          tag=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -ser '
            [ .[][] | select(.draft == false and .prerelease == false)
              | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) ]
            | max_by(ltrimstr("v") | split(".") | map(tonumber))')
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" -p runtime-artifacts.tar -p runtime-artifacts.json -D "$RUNNER_TEMP/guest"
          gh release verify-asset "$tag" "$RUNNER_TEMP/guest/runtime-artifacts.json"
          gh release verify-asset "$tag" "$RUNNER_TEMP/guest/runtime-artifacts.tar"
      - name: Read the previous daily report if available
        run: |
          runs=$(gh run list --workflow guest-kernel.yaml --branch "$GITHUB_REF_NAME" --status completed --limit 30 --json databaseId --jq '.[].databaseId')
          for previous in $runs; do
            available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous/artifacts" --jq 'any(.artifacts[]; .name == "stable-guest-kernel" and (.expired | not))')
            if [[ "$available" == true ]]; then
              gh run download "$previous" -n stable-guest-kernel -D "$RUNNER_TEMP/previous"
              break
            fi
          done
      - name: Check for new critical findings
        run: |
          nix run .#guest-kernel-scan -- "$RUNNER_TEMP/guest" --release "$RELEASE_TAG" \
            --report "$RUNNER_TEMP/guest-kernel.json" --previous "$RUNNER_TEMP/previous/guest-kernel.json"
      - name: Save the daily report
        if: "!cancelled()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stable-guest-kernel
          retention-days: 30
          overwrite: true
          path: ${{ runner.temp }}/guest-kernel.json
          if-no-files-found: ignore

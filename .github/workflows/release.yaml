name: release
on:
  push:
    tags:
      - 'v*'
      - '!v*-preview.*'
  workflow_dispatch:
    inputs:
      commit:
        description: Full main commit SHA to publish as a preview
        required: true
        type: string
concurrency:
  group: release-checkpoint
  cancel-in-progress: false
  # actionlint 1.7.9 lacks queue: https://github.com/rhysd/actionlint/issues/687
  queue: max
permissions:
  contents: read
  actions: read
jobs:
  admission:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-preview.'))
    runs-on: ubuntu-24.04
    outputs:
      selection: ${{ steps.admit.outputs.selection }}
      complete: ${{ steps.admit.outputs.complete }}
    steps:
      - name: Human tags remain single-attempt
        if: github.event_name == 'push' && github.run_attempt != 1
        run: |
          echo 'human tag cohorts are single-attempt; create a new tag after partial publication' >&2
          exit 1
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ''
      - name: Admit native CI and exact selected source
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#release -c python3 scripts/release/main.py admit
  build:
    needs: admission
    if: >-
      needs.admission.outputs.complete != 'true'
    uses: ./.github/workflows/build-artifacts.yaml
    with:
      selection: ${{ needs.admission.outputs.selection }}
      tools_commit: ${{ github.workflow_sha }}
  integration:
    needs: admission
    if: needs.admission.outputs.complete != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [ci-generated, ci-postgres, ci-browser]
    env:
      CI_APP: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ fromJSON(needs.admission.outputs.selection).sourceCommit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - run: nix run ".#$CI_APP"
  publish-preview:
    needs: [admission, build, integration]
    if: >-
      always() &&
      needs.admission.result == 'success' &&
      needs.admission.outputs.complete != 'true' &&
      needs.build.result == 'success' &&
      needs.integration.result == 'success' &&
      fromJSON(needs.admission.outputs.selection).build.mode != 'tag'
    outputs:
      build_digest: ${{ steps.stage.outputs.build_digest }}
      publisher_run: ${{ github.run_id }}
      publisher_attempt: ${{ steps.stage.outputs.publisher_attempt }}
    runs-on: ubuntu-24.04
    environment: preview
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write # Preview S3 publisher OIDC and npm trusted publishing. security-check: allow-id-token
    env:
      RELEASE_SELECTION: ${{ needs.admission.outputs.selection }}
      PREVIEW_BUCKET: ${{ vars.PREVIEW_BUCKET }}
      PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
      PREVIEW_PUBLISHER_ROLE_ARN: ${{ vars.PREVIEW_PUBLISHER_ROLE_ARN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ''
      - name: Assume preview publisher role
        run: nix develop .#release -c bash scripts/release/assume-preview-role.sh
      - name: Publish preview cohort to fixed-origin object store
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          nix develop .#release -c bash -euo pipefail <<'SH'
          python3 scripts/release/main.py assemble --directory "$RUNNER_TEMP/assets"
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry-auth.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GHCR_ACTOR" --password-stdin
          python3 scripts/release/main.py stage --directory "$RUNNER_TEMP/assets"
          rm -rf "$RUNNER_TEMP/assets"
          SH
  publish-tag:
    needs: [admission, build, integration]
    if: >-
      always() &&
      needs.admission.result == 'success' &&
      needs.admission.outputs.complete != 'true' &&
      needs.build.result == 'success' &&
      needs.integration.result == 'success' &&
      fromJSON(needs.admission.outputs.selection).build.mode == 'tag'
    outputs:
      release_id: ${{ steps.stage_tag.outputs.release_id }}
      build_digest: ${{ steps.stage_tag.outputs.build_digest }}
      publisher_run: ${{ github.run_id }}
      publisher_attempt: ${{ steps.stage_tag.outputs.publisher_attempt }}
      artifact_id: ${{ steps.readback.outputs.artifact-id }}
      artifact_digest: ${{ steps.readback.outputs.artifact-digest }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write # Formal tag npm trusted publishing. security-check: allow-id-token
    env:
      RELEASE_SELECTION: ${{ needs.admission.outputs.selection }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ''
      - name: Publish formal tag cohort through GitHub releases
        id: stage_tag
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          nix develop .#release -c bash -euo pipefail <<'SH'
          python3 scripts/release/main.py assemble --directory "$RUNNER_TEMP/assets"
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry-auth.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GHCR_ACTOR" --password-stdin
          python3 scripts/release/main.py stage --directory "$RUNNER_TEMP/assets" --output "$RUNNER_TEMP/readback"
          rm -rf "$RUNNER_TEMP/assets"
          SH
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: readback
        with:
          name: release-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readback/
          retention-days: 7
          compression-level: 0
          overwrite: false
          if-no-files-found: error
  verify:
    needs: [admission, publish-preview, publish-tag]
    if: >-
      always() &&
      (
        needs.publish-preview.result == 'success' ||
        needs.publish-tag.result == 'success'
      )
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    env:
      RELEASE_SELECTION: ${{ needs.admission.outputs.selection }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ''
      - name: Reconstruct preview cohort from public object store
        if: fromJSON(needs.admission.outputs.selection).build.mode != 'tag'
        env:
          BUILD_DIGEST: ${{ needs.publish-preview.outputs.build_digest }}
        run: nix develop .#release-consumer -c python3 scripts/release/main.py verify --directory "$RUNNER_TEMP/assets" --build-digest "$BUILD_DIGEST"
      - name: Download and verify signed formal tag bytes
        if: fromJSON(needs.admission.outputs.selection).build.mode == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.publish-tag.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.publish-tag.outputs.artifact_digest }}
          PUBLISHER_RUN: ${{ needs.publish-tag.outputs.publisher_run }}
          PUBLISHER_ATTEMPT: ${{ needs.publish-tag.outputs.publisher_attempt }}
          BUILD_DIGEST: ${{ needs.publish-tag.outputs.build_digest }}
        run: |
          nix develop .#release-consumer -c python3 scripts/release/main.py download --directory "$RUNNER_TEMP/assets" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" \
            --publisher-run "$PUBLISHER_RUN" --publisher-attempt "$PUBLISHER_ATTEMPT" --build-digest "$BUILD_DIGEST"
      - name: Execute downloaded consumer without publication authority
        env:
          HELMR_PUBLIC_CONSUMER: '1'
        run: |
          nix develop .#release-consumer -c python3 - "$RUNNER_TEMP/assets" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/release')
          from consumer import consumer
          from contract import read
          import subprocess
          root = Path(sys.argv[1])
          for name in ('bundle-builder.json', 'controlplane.json'):
              subprocess.run(['skopeo', 'inspect', 'docker://' + read(root/name)['image']], check=True)
          consumer(root, root/'helmr-linux-amd64.tar.gz', root/'consumer')
          PY
  complete-preview:
    needs: [admission, publish-preview, publish-tag, verify]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.publish-preview.result == 'success' &&
      fromJSON(needs.admission.outputs.selection).build.mode != 'tag'
    outputs:
      index_digest: ${{ steps.finalize.outputs.index_digest }}
    runs-on: ubuntu-24.04
    environment: preview
    permissions:
      contents: read
      id-token: write # Complete preview index signing. security-check: allow-id-token
    env:
      RELEASE_SELECTION: ${{ needs.admission.outputs.selection }}
      PREVIEW_BUCKET: ${{ vars.PREVIEW_BUCKET }}
      PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
      PREVIEW_PUBLISHER_ROLE_ARN: ${{ vars.PREVIEW_PUBLISHER_ROLE_ARN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ''
      - name: Assume preview publisher role
        run: nix develop .#release -c bash scripts/release/assume-preview-role.sh
      - name: Complete preview index last and verify public readback
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_DIGEST: ${{ needs.publish-preview.outputs.build_digest }}
        run: |
          nix develop .#release -c python3 scripts/release/main.py finalize --directory "$RUNNER_TEMP/complete" --build-digest "$BUILD_DIGEST"
  complete-tag:
    needs: [admission, publish-preview, publish-tag, verify]
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      needs.publish-tag.result == 'success' &&
      fromJSON(needs.admission.outputs.selection).build.mode == 'tag'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write # Formal tag completion. security-check: allow-id-token
    env:
      RELEASE_SELECTION: ${{ needs.admission.outputs.selection }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ''
      - name: Publish formal tag complete index last and verify public readback
        id: finalize_tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.publish-tag.outputs.release_id }}
          BUILD_DIGEST: ${{ needs.publish-tag.outputs.build_digest }}
        run: |
          nix develop .#release -c python3 scripts/release/main.py finalize --directory "$RUNNER_TEMP/complete" \
            --release-id "$RELEASE_ID" --build-digest "$BUILD_DIGEST"
  discovery:
    needs: [admission, complete-preview, complete-tag]
    if: >-
      always() && needs.admission.result == 'success' &&
      (needs.complete-preview.result == 'success' || needs.admission.outputs.complete == 'true') &&
      fromJSON(needs.admission.outputs.selection).build.mode == 'main'
    runs-on: ubuntu-24.04
    environment: preview
    permissions:
      contents: read
      id-token: write # Preview channel pointer CAS. security-check: allow-id-token
    env:
      RELEASE_SELECTION: ${{ needs.admission.outputs.selection }}
      INDEX_DIGEST: ${{ needs.complete-preview.outputs.index_digest }}
      PREVIEW_BUCKET: ${{ vars.PREVIEW_BUCKET }}
      PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
      PREVIEW_PUBLISHER_ROLE_ARN: ${{ vars.PREVIEW_PUBLISHER_ROLE_ARN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ''
      - name: Assume preview publisher role
        run: nix develop .#release -c bash scripts/release/assume-preview-role.sh
      - name: Update preview channel pointer without regression
        run: |
          nix develop .#release -c bash -euo pipefail <<'SH'
          if [ -n "${INDEX_DIGEST:-}" ]; then
            python3 scripts/release/main.py discover --index-digest "$INDEX_DIGEST"
          else
            python3 scripts/release/main.py discover
          fi
          SH

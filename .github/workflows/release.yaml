name: release
on:
  push:
    tags:
      - 'v*'
      - '!v*-preview.*'
  # Native ci.yaml identity/admission; privileged jobs execute only workflow SHA source.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full current head SHA of an open same-repository PR to main
        required: true
        type: string
      pr:
        description: Open Product PR number
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  admission:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-preview.'))
    runs-on: ubuntu-24.04
    outputs:
      selection: ${{ steps.admit.outputs.selection }}
      complete: ${{ steps.admit.outputs.complete }}
      skip: ${{ steps.admit.outputs.skip }}
    steps:
      - name: Human tags remain single-attempt
        if: github.event_name == 'push' && github.run_attempt != 1
        run: |
          echo 'human tag cohorts are single-attempt; create a new tag after partial publication' >&2
          exit 1
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ''
      - name: Admit native CI and exact selected source
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#images -c python3 scripts/release/main.py admit
  build:
    needs: admission
    if: needs.admission.outputs.skip != 'true' && needs.admission.outputs.complete != 'true'
    uses: ./.github/workflows/build-artifacts.yaml
    with:
      selection: ${{ needs.admission.outputs.selection }}
      tools_commit: ${{ github.workflow_sha }}
  publish:
    needs: [admission, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write # Keyless component evidence and npm trusted publishing. security-check: allow-id-token
    env:
      RELEASE_SELECTION: ${{ needs.admission.outputs.selection }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ''
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Admit and publish frozen common bytes (no candidate execution)
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          python3 scripts/release/main.py assemble --directory "$RUNNER_TEMP/assets"
          nix develop .#images -c bash -euo pipefail <<'SH'
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/registry-auth.json"
          trap 'rm -f "$REGISTRY_AUTH_FILE"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io --username "$GHCR_ACTOR" --password-stdin
          python3 scripts/release/main.py stage --directory "$RUNNER_TEMP/assets"
          SH
  verify:
    needs: [admission, publish]
    runs-on: ubuntu-24.04
    env:
      RELEASE_SELECTION: ${{ needs.admission.outputs.selection }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ''
      - name: Download and verify signed candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#images -c python3 scripts/release/main.py download --directory "$RUNNER_TEMP/assets"
      - name: Execute downloaded consumer without publication authority
        env:
          HELMR_PUBLIC_CONSUMER: '1'
        run: |
          nix develop .#images -c python3 - "$RUNNER_TEMP/assets" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/release')
          from consumer import consumer
          from contract import read
          import subprocess
          root = Path(sys.argv[1])
          for name in ('bundle-builder.json', 'controlplane.json'):
              subprocess.run(['skopeo', 'inspect', 'docker://' + read(root/name)['image']], check=True)
          consumer(root, root/'helmr-linux-amd64.tar.gz', root/'consumer')
          PY
  complete:
    needs: [admission, verify]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write # Sign the complete index only after consumer success. security-check: allow-id-token
    env:
      RELEASE_SELECTION: ${{ needs.admission.outputs.selection }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ''
      - name: Publish complete index last and verify public readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#images -c python3 scripts/release/main.py finalize --directory "$RUNNER_TEMP/complete"
  discovery:
    needs: [admission, complete]
    if: >-
      always() && needs.admission.result == 'success' &&
      (needs.complete.result == 'success' || needs.admission.outputs.complete == 'true') &&
      fromJSON(needs.admission.outputs.selection).build.mode == 'main'
    runs-on: ubuntu-24.04
    concurrency:
      group: product-preview-discovery
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ''
      - name: Reconcile newest signed complete main preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop .#images -c python3 scripts/release/main.py discover

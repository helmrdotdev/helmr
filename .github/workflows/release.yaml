name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORM_RELEASE_TAG_PATTERN: '^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)([.]((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-cohort:
    name: version cohort
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Reject a release rerun
        if: github.run_attempt != 1
        run: |
          echo "release tags are single-attempt; create a new prerelease tag after any failed or partial publication" >&2
          exit 1

      - name: Validate release tag
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq "$PLATFORM_RELEASE_TAG_PATTERN"; then
            echo "release tag must match vX.Y.Z or vX.Y.Z-prerelease" >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Verify release cohort
        run: RELEASE_TAG="$GITHUB_REF_NAME" nix develop --command tests/version_cohort_test.sh "$GITHUB_REF_NAME" "$(git rev-parse HEAD)"

  release-admission:
    name: release admission
    if: startsWith(github.ref, 'refs/tags/v')
    needs: version-cohort
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_AWS_ROLE_ARN: ${{ vars.RELEASE_AWS_ROLE_ARN }}
      RELEASE_AWS_STATE_BUCKET: ${{ vars.RELEASE_AWS_STATE_BUCKET }}
      RELEASE_WORKER_IMAGE_ARTIFACT_BUCKET: ${{ vars.RELEASE_WORKER_IMAGE_ARTIFACT_BUCKET }}
    steps:
      - name: Reject a release rerun
        if: github.run_attempt != 1
        run: |
          echo "release tags are single-attempt; create a new prerelease tag after any failed or partial publication" >&2
          exit 1

      - name: Check release settings
        run: |
          [ -n "$RELEASE_AWS_ROLE_ARN" ] || {
            echo "RELEASE_AWS_ROLE_ARN is required" >&2
            exit 1
          }
          [ -n "$RELEASE_AWS_STATE_BUCKET" ] || {
            echo "RELEASE_AWS_STATE_BUCKET is required" >&2
            exit 1
          }
          [ -n "$RELEASE_WORKER_IMAGE_ARTIFACT_BUCKET" ] || {
            echo "RELEASE_WORKER_IMAGE_ARTIFACT_BUCKET is required" >&2
            exit 1
          }

      - name: Refuse an existing GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status="$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          )" || exit 1
          case "$status" in
            404) ;;
            200) echo "GitHub Release $RELEASE_TAG already exists; a new prerelease tag is required" >&2; exit 1 ;;
            *) echo "failed to check GitHub Release $RELEASE_TAG: HTTP $status" >&2; exit 1 ;;
          esac

  platform-release:
    name: platform release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-admission
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # Needed for keyless Platform release signing. security-check: allow-id-token
    steps:
      - name: Reject a release rerun
        if: github.run_attempt != 1
        run: |
          echo "release tags are single-attempt; create a new prerelease tag after any failed or partial publication" >&2
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Build and sign Platform release
        run: |
          nix develop .#images --command \
            ./scripts/build-platform-release.sh dist/platform-release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-release-assets
          if-no-files-found: error
          retention-days: 7
          path: dist/platform-release

  platform-release-dev:
    name: development platform release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref, 'refs/heads/') &&
      github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Needed for keyless development release signing. security-check: allow-id-token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Build and sign development Platform release
        run: |
          nix develop .#images --command \
            ./scripts/build-platform-release.sh dist/platform-release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-release-assets
          if-no-files-found: error
          retention-days: 7
          path: dist/platform-release

  bundle-builder-image:
    name: bundle builder image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-admission
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      BUILDER_IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/bundle-builder
    steps:
      - name: Reject a release rerun
        if: github.run_attempt != 1
        run: |
          echo "release tags are single-attempt; create a new prerelease tag after any failed or partial publication" >&2
          exit 1

      - name: Validate release tag
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq "$PLATFORM_RELEASE_TAG_PATTERN"; then
            echo "release tag must match vX.Y.Z or vX.Y.Z-prerelease" >&2
            exit 1
          fi
          git check-ref-format --allow-onelevel "$RELEASE_TAG"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Build and publish canonical bundle builder
        id: publish
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          nix build .#bundleBuilderImage --out-link result-bundle-builder
          nix build .#runtimeRelease --out-link result-runtime-release
          docker load -i result-bundle-builder
          image_tag="$BUILDER_IMAGE_REPOSITORY:$RELEASE_TAG"
          docker tag helmr/bundle-builder:0 "$image_tag"
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
          docker push "$image_tag"
          digest="$(docker buildx imagetools inspect "$image_tag" --format '{{json .Manifest.Digest}}' | jq -er '.')"
          image="$BUILDER_IMAGE_REPOSITORY@$digest"
          docker logout ghcr.io
          printf 'image=%s\n' "$image" >>"$GITHUB_OUTPUT"
          mkdir -p dist
          jq -cS -n \
            --arg image "$image" \
            --arg sourceCommit "$(git rev-parse HEAD)" \
            --argjson runtime "$(cat result-runtime-release/runtime.descriptor.json)" \
            '{formatVersion:0,image:$image,runtime:$runtime,sourceCommit:$sourceCommit}' \
            >dist/bundle-builder.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bundle-builder-release
          if-no-files-found: error
          retention-days: 30
          path: dist/bundle-builder.json

  cli:
    name: cli
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: bundle-builder-image
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      BUNDLE_BUILDER_IMAGE: ${{ needs.bundle-builder-image.outputs.image }}
    steps:
      - name: Reject a release rerun
        if: github.run_attempt != 1
        run: |
          echo "release tags are single-attempt; create a new prerelease tag after any failed or partial publication" >&2
          exit 1

      - name: Validate release tag
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq "$PLATFORM_RELEASE_TAG_PATTERN"; then
            echo "release tag must match vX.Y.Z or vX.Y.Z-prerelease" >&2
            exit 1
          fi
          git check-ref-format --allow-onelevel "$RELEASE_TAG"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Build CLI archives
        run: |
          nix develop --command bash -euo pipefail <<'EOF'
          bun install --frozen-lockfile --ignore-scripts
          scripts/build-runtime-entry.sh --check
          source_commit="$(git rev-parse HEAD)"
          mkdir -p dist/cli
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            out_dir="dist/cli/helmr-${os}-${arch}"
            mkdir -p "$out_dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w -X github.com/helmrdotdev/helmr/internal/version.Version=${RELEASE_TAG} -X github.com/helmrdotdev/helmr/internal/version.SourceCommit=${source_commit} -X main.deploymentBundleBuilderImage=${BUNDLE_BUILDER_IMAGE}" \
              -o "$out_dir/helmr" \
              ./cmd/helmr
            tar -C "$out_dir" -czf "dist/helmr-${RELEASE_TAG}-${os}-${arch}.tar.gz" helmr
          done
          cd dist
          sha256sum "helmr-${RELEASE_TAG}-"*.tar.gz >checksums.txt
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/helmr-v*-linux-amd64.tar.gz
            dist/helmr-v*-linux-arm64.tar.gz
            dist/helmr-v*-darwin-amd64.tar.gz
            dist/helmr-v*-darwin-arm64.tar.gz
            dist/checksums.txt

  controlplane-image:
    name: controlplane image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-admission
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CONTROLPLANE_IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/control-plane
    steps:
      - name: Reject a release rerun
        if: github.run_attempt != 1
        run: |
          echo "release tags are single-attempt; create a new prerelease tag after any failed or partial publication" >&2
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Build controlplane image
        env:
          IMAGE_URI: ${{ env.CONTROLPLANE_IMAGE_REPOSITORY }}:${{ env.RELEASE_TAG }}
        run: |
          nix develop .#images --command ./scripts/build-controlplane-image.sh "$IMAGE_URI"
          mkdir -p dist
          docker save "$IMAGE_URI" -o dist/controlplane-image.tar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: controlplane-image
          if-no-files-found: error
          retention-days: 7
          path: dist/controlplane-image.tar

  worker-ami:
    name: worker AMI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    permissions:
      contents: read
      id-token: write # Needed to assume the AWS release role through GitHub OIDC. security-check: allow-id-token
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      WORKER_AMI_REGIONS: ${{ vars.RELEASE_WORKER_AMI_REGIONS || 'us-east-1,us-west-2,ap-northeast-1' }}
      AWS_REGION: ${{ vars.RELEASE_AWS_REGION || 'us-east-1' }}
      STATE_REGION: ${{ vars.RELEASE_AWS_STATE_REGION || vars.RELEASE_AWS_REGION || 'us-east-1' }}
      STATE_BUCKET: ${{ vars.RELEASE_AWS_STATE_BUCKET }}
      WORKER_IMAGE_ARTIFACT_BUCKET: ${{ vars.RELEASE_WORKER_IMAGE_ARTIFACT_BUCKET }}
      STATE_KEY_BASE: ${{ vars.RELEASE_AWS_STATE_KEY || 'helmr/stacks/release-worker-image/terraform.tfstate' }}
      WORKER_IMAGE_NAME_BASE: ${{ vars.RELEASE_WORKER_IMAGE_NAME || 'helmr-worker' }}
      IMAGE_WAIT_INTERVAL_SECONDS: ${{ vars.RELEASE_WORKER_IMAGE_WAIT_INTERVAL_SECONDS || '60' }}
      IMAGE_WAIT_TIMEOUT_SECONDS: ${{ vars.RELEASE_IMAGE_WAIT_TIMEOUT_SECONDS || '14400' }}
      TOFU_APPLY_ARGS: -auto-approve
    steps:
      - name: Reject a release rerun
        if: github.run_attempt != 1
        run: |
          echo "release tags are single-attempt; create a new prerelease tag after any failed or partial publication" >&2
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.RELEASE_AWS_ROLE_ARN }}
          role-duration-seconds: 14400
          mask-aws-account-id: true

      - uses: ./.github/actions/setup-nix

      - name: Resolve worker AMI identity
        run: |
          scripts/release-worker-image-identity.sh \
            "$RELEASE_TAG" \
            "$WORKER_IMAGE_NAME_BASE" \
            "$STATE_KEY_BASE" >"$RUNNER_TEMP/worker-image-identity.env"
          while IFS='=' read -r key value; do
            case "$key" in
              worker_image_name)
                printf 'WORKER_IMAGE_NAME=%s\n' "$value" >>"$GITHUB_ENV"
                ;;
              state_key)
                printf 'STATE_KEY=%s\n' "$value" >>"$GITHUB_ENV"
                ;;
            esac
          done <"$RUNNER_TEMP/worker-image-identity.env"

      - name: Build worker AMIs
        id: build_worker_image
        env:
          WORKER_IMAGE_DISTRIBUTION_REGIONS: ${{ env.WORKER_AMI_REGIONS }}
          WORKER_IMAGE_AMI_PUBLIC: "true"
          WORKER_IMAGE_ROOT_VOLUME_ENCRYPTED: "false"
        run: |
          nix develop .#infra --command bash -euo pipefail <<'EOF'
          scripts/aws-release-artifacts.sh check
          scripts/aws-release-artifacts.sh worker-image-init
          scripts/aws-release-artifacts.sh worker-image-apply
          scripts/aws-release-artifacts.sh worker-image-start
          scripts/aws-release-artifacts.sh worker-image-wait
          worker_image_json="$(scripts/aws-release-artifacts.sh worker-image-receipt)"
          printf 'worker_image_json=%s\n' "$worker_image_json" >>"$GITHUB_OUTPUT"
          EOF

      - name: Write worker image artifact
        env:
          WORKER_IMAGE_JSON: ${{ steps.build_worker_image.outputs.worker_image_json }}
        run: |
          mkdir -p dist
          printf '%s\n' "$WORKER_IMAGE_JSON" | jq -cS . >dist/worker-image.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: worker-image-artifact
          if-no-files-found: error
          retention-days: 30
          path: dist/worker-image.json

  publish:
    name: publish artifacts
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.cli.result == 'success' &&
      needs.bundle-builder-image.result == 'success' &&
      needs.controlplane-image.result == 'success' &&
      needs.worker-ami.result == 'success' &&
      needs.platform-release.result == 'success'
    needs:
      - platform-release
      - bundle-builder-image
      - cli
      - controlplane-image
      - worker-ami
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      controlplane_image: ${{ steps.push.outputs.controlplane_image }}
    permissions:
      contents: read
      id-token: write # Needed to verify Worker AMIs through the AWS release role. security-check: allow-id-token
      packages: write # Needed to publish the official Control Plane image.
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CONTROLPLANE_IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/control-plane
      IMAGE_URI: ghcr.io/${{ github.repository }}/control-plane:${{ github.ref_name }}
      WORKER_AMI_REGIONS: ${{ vars.RELEASE_WORKER_AMI_REGIONS || 'us-east-1,us-west-2,ap-northeast-1' }}
      AWS_REGION: ${{ vars.RELEASE_AWS_REGION || 'us-east-1' }}
    steps:
      - name: Reject a release rerun
        if: github.run_attempt != 1
        run: |
          echo "release tags are single-attempt; create a new prerelease tag after any failed or partial publication" >&2
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: platform-release-assets
          path: dist/platform-release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: controlplane-image
          path: dist/controlplane-image

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: worker-image-artifact
          path: dist/worker

      - name: Push controlplane image
        id: push
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          docker load -i dist/controlplane-image/controlplane-image.tar
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
          push_output="$(docker push "$IMAGE_URI")"
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | awk '/digest:/ { print $3 }' | tail -n 1)"
          [ -n "$digest" ]
          printf 'controlplane_image=%s@%s\n' "$CONTROLPLANE_IMAGE_REPOSITORY" "$digest" >>"$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.RELEASE_AWS_ROLE_ARN }}
          mask-aws-account-id: true

      - name: Write AWS release manifest
        env:
          CONTROLPLANE_IMAGE: ${{ steps.push.outputs.controlplane_image }}
          REQUIRED_WORKER_AMI_REGIONS: ${{ env.WORKER_AMI_REGIONS }}
          VERIFY_RELEASE_ARTIFACTS: "1"
        run: |
          scripts/write-aws-release-manifest.sh \
            "$CONTROLPLANE_IMAGE" \
            "$(cat dist/worker/worker-image.json)" \
            "$(cat dist/platform-release/platform-release-provenance.json)" \
            dist/aws-artifacts.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aws-release-manifest
          if-no-files-found: error
          retention-days: 30
          path: dist/aws-artifacts.json

  verify-public-images:
    name: verify public images
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - bundle-builder-image
      - publish
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      BUNDLE_BUILDER_IMAGE: ${{ needs.bundle-builder-image.outputs.image }}
      CONTROLPLANE_IMAGE: ${{ needs.publish.outputs.controlplane_image }}
    steps:
      - name: Reject a release rerun
        if: github.run_attempt != 1
        run: |
          echo "release tags are single-attempt; create a new prerelease tag after any failed or partial publication" >&2
          exit 1

      - name: Resolve images anonymously by digest
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          for image in "$CONTROLPLANE_IMAGE" "$BUNDLE_BUILDER_IMAGE"; do
            DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" docker buildx imagetools inspect "$image" >/dev/null
          done

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - publish
      - verify-public-images
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # Needed to create the GitHub Release.
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Reject a release rerun
        if: github.run_attempt != 1
        run: |
          echo "release tags are single-attempt; create a new prerelease tag after any failed or partial publication" >&2
          exit 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: platform-release-assets
          path: dist/platform-release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bundle-builder-release
          path: dist/bundle-builder

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cli-release-assets
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: worker-image-artifact
          path: dist/worker

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: aws-release-manifest
          path: dist

      - name: Refuse an existing GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status="$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          )" || exit 1
          case "$status" in
            404) ;;
            200) echo "GitHub Release $RELEASE_TAG already exists; a new prerelease tag is required" >&2; exit 1 ;;
            *) echo "failed to check GitHub Release $RELEASE_TAG: HTTP $status" >&2; exit 1 ;;
          esac

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Helmr ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ contains(env.RELEASE_TAG, '-') && 'false' || 'true' }}
          files: |
            dist/helmr-v*-linux-amd64.tar.gz
            dist/helmr-v*-linux-arm64.tar.gz
            dist/helmr-v*-darwin-amd64.tar.gz
            dist/helmr-v*-darwin-arm64.tar.gz
            dist/checksums.txt
            dist/bundle-builder/bundle-builder.json
            dist/platform-release/platform-release.tar
            dist/platform-release/platform-release.sigstore.json
            dist/platform-release/platform-release-provenance.json
            dist/aws-artifacts.json
            dist/worker/worker-image.json

  typescript-sdk-packages:
    name: typescript sdk packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-admission
    runs-on: ubuntu-24.04
    outputs:
      sdk_version: ${{ steps.version.outputs.sdk_version }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Reject a release rerun
        if: github.run_attempt != 1
        run: |
          echo "release tags are single-attempt; create a new prerelease tag after any failed or partial publication" >&2
          exit 1

      - name: Resolve TypeScript SDK version
        id: version
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq "$PLATFORM_RELEASE_TAG_PATTERN"; then
            echo "release tag must match vX.Y.Z or vX.Y.Z-prerelease" >&2
            exit 1
          fi
          sdk_version="${RELEASE_TAG#v}"
          printf 'sdk_version=%s\n' "$sdk_version" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix

      - name: Build TypeScript SDK npm packages
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.sdk_version }}
        run: |
          nix develop --command bash -euo pipefail <<'EOF'
          bun install --frozen-lockfile --ignore-scripts
          PACKAGE_VERSION="$PACKAGE_VERSION" bun run build:npm
          bun run pack:npm dist/npm-tarballs
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: typescript-sdk-npm-packages
          if-no-files-found: error
          retention-days: 7
          path: dist/npm-tarballs/*.tgz

  typescript-sdk-npm-publish:
    name: typescript sdk npm publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - github-release
      - typescript-sdk-packages
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # Needed for npm Trusted Publishing. security-check: allow-id-token
    steps:
      - name: Reject a release rerun
        if: github.run_attempt != 1
        run: |
          echo "release tags are single-attempt; create a new prerelease tag after any failed or partial publication" >&2
          exit 1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: typescript-sdk-npm-packages
          path: dist/npm-tarballs

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish npm packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SDK_VERSION: ${{ needs.typescript-sdk-packages.outputs.sdk_version }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft)"
          jq -e '.isDraft == false' <<<"$release_json"

          publish_package() {
            package_name="$1"
            tarball="$2"
            if npm view "${package_name}@${SDK_VERSION}" version --json --prefer-online >/dev/null 2>&1; then
              echo "${package_name}@${SDK_VERSION} is already published; a new prerelease tag is required" >&2
              exit 1
            fi
            npm_tag=latest
            case "$SDK_VERSION" in
              *-*) npm_tag=next ;;
            esac
            npm publish "$tarball" --access public --provenance --tag "$npm_tag"
          }
          publish_package @helmr/proto dist/npm-tarballs/helmr-proto-*.tgz
          publish_package @helmr/sdk dist/npm-tarballs/helmr-sdk-*.tgz

name: verify builder toolchain
on:
  push:
    branches: [verify/builder-toolchain-security]
permissions:
  contents: read
jobs:
  builder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3
        with:
          github_access_token: ''
      - run: nix build -L .#bundleBuilderImage
      - run: cp -L result "$RUNNER_TEMP/builder.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: builder-image
          path: ${{ runner.temp }}/builder.tar.gz
          compression-level: 0
          retention-days: 3

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&amp;family=Instrument+Sans:wght@500&amp;display=swap");
    @import url("https://api.fontshare.com/v2/css?f[]=general-sans@400,500&amp;display=swap");
    text { dominant-baseline: text-before-edge; }
    .brand { font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; }
    .display { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .body { font-family: "General Sans", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "Geist Mono", ui-monospace, monospace; }
  </style>

  <rect width="1200" height="630" fill="#ffffff"/>

  <image href="../brand/helmr-mark.svg" x="72" y="67" width="45" height="26"/>
  <text class="brand" x="128" y="61" font-size="35" font-weight="500" letter-spacing="-0.875" fill="#1f1f24">Helmr</text>

  <text class="display" x="72" y="178" font-size="67" font-weight="500" letter-spacing="-3.35" fill="#1f1f24">
    <tspan x="72" dy="0">The code-first runtime</tspan>
    <tspan x="72" dy="70">for AI agents.</tspan>
  </text>

  <text class="body" x="76" y="357" font-size="25" font-weight="400" fill="#585862">
    <tspan x="76" dy="0">Define agent workloads in TypeScript.</tspan>
    <tspan x="76" dy="37">Run them in isolated microVMs with durable workspaces.</tspan>
  </text>

  <rect x="748.5" y="143.5" width="379" height="299" fill="#ffffff" stroke="#e5e5e3"/>
  <image href="helmr-art.png" x="759" y="154" width="358" height="278" preserveAspectRatio="xMidYMid slice"/>
  <text class="mono" x="749" y="458" font-size="14" letter-spacing="0.28" fill="#8b8a91">fig. 01 — steady at the helm</text>

  <line x1="72" y1="557.5" x2="1128" y2="557.5" stroke="#e5e5e3"/>
  <text class="body" x="72" y="576" font-size="17" font-weight="500" fill="#1f1f24">helmr.dev</text>
</svg>
